services:
  ignition:
    image: inductiveautomation/ignition:8.3.9
    container_name: ignition
    restart: unless-stopped

    ports:
      - "${IGNITION_BIND_ADDRESS:-0.0.0.0}:${IGNITION_HTTP_PORT:-8088}:8088"

    environment:
      ACCEPT_IGNITION_EULA: "Y"
      IGNITION_EDITION: "maker"
      GATEWAY_ADMIN_USERNAME: "${GATEWAY_ADMIN_USERNAME:-admin}"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD}"
      IGNITION_LICENSE_KEY: "${IGNITION_LICENSE_KEY}"
      IGNITION_ACTIVATION_TOKEN: "${IGNITION_ACTIVATION_TOKEN}"
      TZ: "${TZ:-Europe/Copenhagen}"

    volumes:
      - type: bind
        source: "${IGNITION_DATA_PATH:-/opt/ignition/data}"
        target: /usr/local/bin/ignition/data

    command:
      - "-n"
      - "${IGNITION_GATEWAY_NAME:-home-automation}"
      - "--"
      - "gateway.useProxyForwardedHeader=true"

    # Keep Docker's stdout/stderr logs from consuming the Raspberry Pi disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 2m
